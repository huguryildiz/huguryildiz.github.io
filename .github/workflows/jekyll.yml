# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Regenerates the CV PDF daily even if nothing else triggered a build
  schedule:
    - cron: "17 4 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.321.0
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CV renderer dependencies
        run: pip install --quiet jinja2 pyyaml
      - name: Render main.tex from _data/cv.yml
        run: python scripts/render_cv_tex.py --out main.tex
      - name: Compile CV PDF
        # https://github.com/xu-cheng/latex-action/releases/tag/v3
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
      - name: Place CV artifacts into the built site
        run: |
          test -s main.pdf || { echo "PDF üretilmedi veya boş"; exit 1; }
          test -s main.tex || { echo "main.tex üretilmedi veya boş"; exit 1; }
          mkdir -p _site/files
          cp main.pdf _site/files/Yildiz_HuseyinUgur_CV.pdf
          cp main.tex _site/files/Yildiz_HuseyinUgur_CV.tex
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
