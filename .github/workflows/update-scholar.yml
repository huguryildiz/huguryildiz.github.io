name: Update Google Scholar Metrics

on:
  schedule:
    - cron: "30 1 * * 1"   # Every Monday at 01:30 UTC
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Scholar metrics
        env:
          # Repo → Settings → Secrets → Actions → New repository secret
          # Name:  SERPAPI_KEY          Value: https://serpapi.com/manage-api-key
          # Name:  SCHOLAR_AUTHOR_ID    Value: nQwHS1gAAAAJ
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_AUTHOR_ID: ${{ secrets.SCHOLAR_AUTHOR_ID }}
        run: python scripts/fetch_scholar.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add _data/scholar_metrics.json
          # The commit message deliberately carries no CI-skip tag: the pages state that
          # the metrics are refreshed weekly, so this commit has to trigger a Pages
          # rebuild — otherwise the snapshot advances in the repository while the live
          # site keeps serving the previous numbers and a stale "updated" date.
          git diff --cached --quiet || git commit -m "chore: update Google Scholar metrics"
          git push
