# =========================
# Site Settings
# =========================
title: "Huseyin Ugur Yildiz"
name: "Huseyin Ugur Yildiz"
description: "Associate Professor of Electrical Engineering with expertise in operations research and ML/RL-driven network optimization for wireless, underwater, and aerial networks."
locale: en-US
url: "https://huguryildiz.com"
baseurl: ""
repository: "huguryildiz/huguryildiz.github.io"
timezone: Europe/Istanbul

# =========================
# Plugins
# =========================
# There is no theme. Every page renders through _layouts/academic.html, styled by
# assets/css/redesign.css. Search is off by design: it only ever indexed _posts,
# so the academic pages were never searchable.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# =========================
# SEO
# =========================
# jekyll-seo-tag reads `social` for the JSON-LD Person block and `title_separator`
# for page titles. It is invoked as {% seo %} in _layouts/academic.html.
title_separator: "|"

social:
  type: Person
  name: "Huseyin Ugur Yildiz"
  links:
    - "https://github.com/huguryildiz"
    - "https://www.linkedin.com/in/huguryildiz/"
    - "https://scholar.google.com/citations?user=nQwHS1gAAAAJ"

# =========================
# Author
# =========================
# jekyll-seo-tag reads `name`. The remaining keys are reference values for the
# metrics scripts and maintainers; nothing renders them.
author:
  name: "Huseyin Ugur Yildiz"
  email: "hugur.yildiz@tedu.edu.tr"
  uri: "https://www.tedu.edu.tr/en/huseyin-ugur-yildiz"
  googlescholar: "https://scholar.google.com/citations?user=nQwHS1gAAAAJ"
  orcid: "https://orcid.org/0000-0002-1556-2634"
  openalex_author_id: "A5085505896"

# =========================
# Analytics
# =========================
# GTM, GA4 and GoatCounter are hardcoded in _includes/_shared/site-analytics.html.
# The IDs live there and nowhere else.

# =========================
# Include Pages
# =========================
include:
  - _pages

# =========================
# Page Defaults
# =========================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# =========================
# Markdown
# =========================
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/

# =========================
# Excludes
# =========================
# Jekyll skips dot- and underscore-prefixed paths on its own; everything listed
# here is a source path that would otherwise be copied verbatim into _site/ and
# published. CNAME must stay out of this list — GitHub Pages needs it served.
exclude:
  - README.md
  - AGENTS.md
  - PRODUCT.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts/
  - cv-latex/
  - analytics-archive/
  - docs/
  - Dockerfile
  - docker-compose.yaml
  - design-artifacts/

# Force rebuild
force_rebuild: 2026-02-11-06
