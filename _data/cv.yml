# DIVERGED — bkz. task-2-report.md. Web sürümü /cv/ sayfasında render edilir;
# LaTeX sürümü yalnızca veri olarak tutulur (main.tex Summary bölümü, main.tex:95).
summary_web: >-
  Associate Professor specializing in operations research and mathematical optimization for
  wireless, underwater, and drone-assisted communication systems. Over a decade of research
  developing optimization-based models for routing, resource allocation, reliability, and energy
  efficiency in complex networked systems, increasingly integrating reinforcement learning for
  dynamic and large-scale environments. Current interests extend to hybrid optimization–learning
  methodologies for next-generation paradigms, including quantum network routing. Active as
  editor, reviewer, and technical program committee member, alongside teaching, curriculum
  development, accreditation, and academic leadership.
summary_tex: >-
  Associate Professor of Electrical and Electronics Engineering with a Ph.D. specializing in
  operations research and optimization for wireless, underwater, and aerial communication
  systems. Over 10 years of research experience, I develop mathematical optimization models for
  routing, resource allocation, reliability, and energy efficiency across complex networked
  systems, integrating reinforcement learning techniques for dynamic and large-scale
  environments. My current interests include hybrid optimization–learning methodologies for
  next-generation network paradigms, including quantum communication systems. I have authored
  40+ peer-reviewed journal and conference publications and actively serve as editor, reviewer,
  and TPC member. I also teach probability, signals and systems, and communication networks,
  contributing to curriculum development, accreditation, and academic leadership.

