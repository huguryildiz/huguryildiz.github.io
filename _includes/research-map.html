<figure class="rmap" id="research-map">
  <div class="rmap-views" role="group" aria-label="Map view">
    <button type="button" data-view="tree" aria-pressed="true">Overview</button>
    <button type="button" data-view="relations" aria-pressed="false">Topic relations</button>
  </div>
  <div class="rmap-grid" id="rmapGrid">
    <svg class="rmap-wires" aria-hidden="true" focusable="false"></svg>
    <div class="rmap-core" id="rmapCore">
      <span class="t">Operations Research</span>
      <span class="s">LP · MILP · CP · network flow · multi-objective</span>
    </div>
    {%- for area in site.data.research_map -%}
    {%- assign npubs = 0 -%}
    {%- for g in area.groups -%}{%- assign npubs = npubs | plus: g.pubs.size -%}{%- endfor -%}
    <details class="rmap-node {{ area.status }}" id="map-{{ area.id }}">
      <summary aria-label="{{ area.title }} — {% if npubs > 0 %}{{ npubs }} publications{% else %}exploratory, no publications yet{% endif %}">
        <span class="rmap-title">{{ area.title }}</span>
        {%- if area.status == 'established' -%}
        <span class="rmap-count tnum">{{ npubs }}<span class="sr-only"> publications</span></span>
        {%- else -%}
        <span class="status ongoing">{{ area.status }}</span>
        {%- endif -%}
        <svg class="rmap-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="rmap-panel">
        {%- if area.note -%}<p class="rmap-note">{{ area.note }}</p>{%- endif -%}
        {%- if area.groups.size > 0 -%}
        <div class="rmap-branches">
          {%- for g in area.groups -%}
          <details class="rmap-sub" id="map-{{ area.id }}-{{ g.name | slugify }}">
            <summary aria-label="{{ g.name }} — {{ g.pubs.size }} publications">
              <span class="rmap-subtitle">{{ g.name }}</span>
              <span class="rmap-count tnum">{{ g.pubs.size }}<span class="sr-only"> publications</span></span>
              <svg class="rmap-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </summary>
            <ul class="rmap-pubs">
              {%- for p in g.pubs -%}
              <li>
                <a class="ext" href="{% if p.url contains '://' %}{{ p.url }}{% else %}{{ p.url | relative_url }}{% endif %}" target="_blank" rel="noopener">{{ p.title }}</a>
                <span class="m"><i>{{ p.venue }}</i>, {{ p.year }}{% if p.note %} · <span class="tag tag-award">{{ p.note }}</span>{% endif %}</span>
              </li>
              {%- endfor -%}
            </ul>
          </details>
          {%- endfor -%}
        </div>
        {%- else -%}
        <ul class="chiprow" aria-label="Keywords">
          {%- for kw in area.keywords -%}<li class="chip">{{ kw }}</li>{%- endfor -%}
        </ul>
        {%- endif -%}
      </div>
    </details>
    {%- endfor -%}
  </div>
  <div class="rgraph-wrap" hidden>
    <div class="rgraph-key" aria-hidden="true">
      <span><i class="solid"></i>publication-backed</span>
      <span><i class="frontier"></i>ongoing / exploratory</span>
    </div>
    <div class="rgraph-stage">
      <svg class="rgraph" viewBox="0 0 900 560" role="group" aria-label="Research constellation: shared topics connecting the research areas">
        <defs>
          <filter id="rgGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="6"/>
          </filter>
        </defs>
        <g class="rg-contours" aria-hidden="true">
          <path d="M18 108C86 22 213 31 277 76s129 27 188-8 168-54 246-8 126 40 171 6"/>
          <path d="M6 169c83-75 180-72 252-26s145 38 211 1 155-56 238-13 130 51 180 17"/>
          <path d="M14 239c71-53 166-54 235-17s142 41 216 8 158-52 235-18 133 53 190 34"/>
          <path d="M7 320c79-39 163-40 240-10s139 39 219 11 153-42 237-16 132 44 188 33"/>
          <path d="M16 402c74-30 153-21 226 9s147 35 219 13 156-31 237-8 135 36 188 25"/>
          <path d="M12 486c76-23 155-6 226 20s151 26 224 8 151-19 231 2 137 25 193 8"/>
        </g>
        <g class="rg-edges" aria-hidden="true">
          {%- for edge in site.data.research_relations.edges -%}
          {%- assign source = site.data.research_relations.nodes | where: "id", edge.from | first -%}
          {%- assign target = site.data.research_relations.nodes | where: "id", edge.to | first -%}
          <path class="rg-edge{% if edge.status == 'frontier' %} dashed{% endif %}"
            data-from="{{ edge.from }}" data-to="{{ edge.to }}"
            data-e="{{ edge.from }} {{ edge.to }}" data-bend="{{ edge.bend | default: 0 }}"
            d="M{{ source.x }} {{ source.y }}L{{ target.x }} {{ target.y }}"/>
          {%- endfor -%}
        </g>
        <g class="rg-signals" aria-hidden="true">
          {%- for edge in site.data.research_relations.edges -%}
          {%- if edge.signal -%}
          <circle class="rg-signal{% if edge.status == 'frontier' %} frontier{% endif %}"
            data-from="{{ edge.from }}" data-to="{{ edge.to }}"
            data-e="{{ edge.from }} {{ edge.to }}" data-bend="{{ edge.bend | default: 0 }}"
            data-phase="{{ forloop.index0 }}" r="2.4"/>
          {%- endif -%}
          {%- endfor -%}
        </g>
        <g class="rg-nodes">
          {%- for node in site.data.research_relations.nodes -%}
          <g class="rg-node {{ node.type }} {{ node.status }}" data-id="{{ node.id }}"
            {% if node.open %}data-open="{{ node.open | join: ' ' }}" tabindex="0" role="button"{% else %}tabindex="-1" focusable="false" role="group"{% endif %}
            aria-label="{{ node.aria }}" data-x="{{ node.x }}" data-y="{{ node.y }}" data-radius="{{ node.radius }}"
            transform="translate({{ node.x }} {{ node.y }})"
            style="--sx:{{ node.start_x }}px;--sy:{{ node.start_y }}px;--d:{{ forloop.index0 | times: 38 }}ms">
            <g class="rg-node-body">
              {%- if node.open -%}<circle class="rg-hit" r="{{ node.radius | plus: 14 }}"/>{%- endif -%}
              <circle class="rg-halo" r="{{ node.radius | plus: 10 }}" filter="url(#rgGlow)"/>
              <circle class="rg-ring" r="{{ node.radius | plus: 6 }}"/>
              <circle class="rg-dot" r="{{ node.radius }}"/>
              <circle class="rg-seed" r="{{ node.radius | divided_by: 3 }}"/>
              <text class="rg-label" text-anchor="middle" y="{{ node.label_y }}">
                {%- for line in node.label_lines -%}
                <tspan x="0"{% unless forloop.first %} dy="15"{% endunless %}>{{ line }}</tspan>
                {%- endfor -%}
              </text>
              <text class="rg-meta" text-anchor="middle" y="{{ node.meta_y }}">{{ node.meta }}</text>
            </g>
          </g>
          {%- endfor -%}
        </g>
      </svg>
    </div>
    <ul class="rgraph-list" aria-label="Research areas and shared topics">
      {%- for node in site.data.research_relations.nodes -%}
      {%- if node.open -%}
      <li>
        <button type="button" data-open="{{ node.open | join: ' ' }}">
          <span>{{ node.label_lines | join: ' ' }}</span>
          <small>{{ node.meta }}</small>
        </button>
      </li>
      {%- endif -%}
      {%- endfor -%}
    </ul>
  </div>
  <figcaption class="cap">Solid boxes: established lines of work, evidenced by the publication record.
    Dashed outlines: ongoing integration and exploratory directions. Select an area to see the
    related publications; each title links to the paper. The relations view shows how shared topics
    connect the research areas — selecting a node jumps to its publications in the overview.</figcaption>
</figure>

<script>
(function(){
  var grid = document.getElementById('rmapGrid');
  if (!grid) return;
  var svg = grid.querySelector('.rmap-wires');
  var core = document.getElementById('rmapCore');
  var nodes = Array.prototype.slice.call(grid.querySelectorAll('details.rmap-node'));
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var revealed = reduce, wiresDrawn = reduce, hlId = null;

  function anchor(el){
    var g = grid.getBoundingClientRect(), r = el.getBoundingClientRect();
    return {left:r.left-g.left, right:r.right-g.left, top:r.top-g.top,
            bottom:r.bottom-g.top, cx:r.left-g.left+r.width/2, cy:r.top-g.top+r.height/2};
  }
  function path(d, frontier, key){
    var p = document.createElementNS(NS,'path');
    p.setAttribute('d', d);
    if (frontier) p.setAttribute('class','frontier');
    if (key) p.setAttribute('data-k', key);
    svg.appendChild(p);
    return p;
  }
  function draw(){
    if (getComputedStyle(svg).display === 'none') return;
    var g = grid.getBoundingClientRect();
    svg.setAttribute('viewBox','0 0 '+g.width+' '+g.height);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var c = anchor(core);
    var est = nodes.filter(function(n){return n.classList.contains('established');});
    est.forEach(function(n,i){
      var s = anchor(n.querySelector('summary'));
      var y0 = c.top + (c.bottom - c.top) * (0.3 + 0.2*i);
      var mx = (c.right + s.left)/2;
      path('M'+c.right+' '+y0+' C'+mx+' '+y0+' '+mx+' '+s.cy+' '+s.left+' '+s.cy, false, n.id);
    });
    var ml = grid.querySelector('#map-ml'), q = grid.querySelector('#map-quantum');
    if (ml){
      var m = anchor(ml.querySelector('summary'));
      var my = (c.bottom + m.top)/2;
      path('M'+c.cx+' '+c.bottom+' C'+c.cx+' '+my+' '+m.cx+' '+my+' '+m.cx+' '+m.top, true, 'map-ml');
      if (q){
        var qa = anchor(q.querySelector('summary')), ma = anchor(ml);
        path('M'+ma.right+' '+m.cy+' L'+qa.left+' '+m.cy, true, 'map-ml map-quantum');
      }
    }
    if (!wiresDrawn) armWires();
    applyHl();
  }

  /* Wires start fully retracted and draw themselves once the map scrolls into view. */
  function armWires(){
    Array.prototype.forEach.call(svg.querySelectorAll('path'), function(p){
      var L = p.getTotalLength() || 1;
      p.style.strokeDasharray = L + ' ' + L;
      p.style.strokeDashoffset = L;
    });
    if (revealed) runWires();
  }
  var wireRun = 0;
  function runWires(){
    var ps = Array.prototype.slice.call(svg.querySelectorAll('path'));
    if (!ps.length) return;   /* wires are display:none on narrow screens; arm them if they come back */
    var run = ++wireRun;
    ps.forEach(function(p,i){
      p.style.transition = 'stroke-dashoffset .7s cubic-bezier(.3,0,.2,1) ' + (i*90) + 'ms';
      p.getBoundingClientRect();
      p.style.strokeDashoffset = '0';
    });
    setTimeout(function(){
      if (run !== wireRun) return;
      wiresDrawn = true;
      Array.prototype.forEach.call(svg.querySelectorAll('path'), function(p){
        p.style.transition = ''; p.style.strokeDasharray = ''; p.style.strokeDashoffset = '';
      });
      grid.classList.add('rm-lit');
    }, 760 + ps.length*90);
  }

  function applyHl(){
    Array.prototype.forEach.call(svg.querySelectorAll('path'), function(p){
      var keys = (p.getAttribute('data-k') || '').split(' ');
      p.classList.toggle('hl', !!hlId && keys.indexOf(hlId) > -1);
    });
  }
  function setHl(id){
    hlId = id;
    if (id) grid.setAttribute('data-hl',''); else grid.removeAttribute('data-hl');
    nodes.forEach(function(n){ n.classList.toggle('is-hl', n.id === id); });
    applyHl();
  }
  nodes.forEach(function(n){
    var s = n.querySelector('summary');
    s.addEventListener('mouseenter', function(){ setHl(n.id); });
    s.addEventListener('mouseleave', function(){ setHl(null); });
    s.addEventListener('focus', function(){ setHl(n.id); });
    s.addEventListener('blur', function(){ setHl(null); });
  });

  /* Publication counts tick up with the cards, once. */
  function countUp(el){
    var t = el.firstChild, target = parseInt(t.nodeValue, 10);
    if (!target || target < 2) return;
    var t0 = null;
    function step(now){
      if (t0 === null) t0 = now;
      var k = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - k, 3);
      t.nodeValue = String(Math.round(target * e));
      if (k < 1) requestAnimationFrame(step);
    }
    t.nodeValue = '0';
    requestAnimationFrame(step);
  }

  var cards = [core].concat(nodes);
  if (!reduce) cards.forEach(function(el){ el.classList.add('rm-pre'); });
  function reveal(){
    if (revealed) return;
    revealed = true;
    cards.forEach(function(el,i){
      el.style.setProperty('--d', (i*70) + 'ms');
      el.classList.remove('rm-pre');
      el.classList.add('rm-in');
    });
    Array.prototype.forEach.call(grid.querySelectorAll('.rmap-node > summary .rmap-count'), function(el,i){
      setTimeout(function(){ countUp(el); }, 260 + i*70);
    });
    setTimeout(runWires, 220);
  }

  var booting = true;
  Array.prototype.forEach.call(grid.querySelectorAll('details'), function(n){
    n.addEventListener('toggle', function(){
      draw();
      if (booting) return;
      if (n.open) history.replaceState(null,'','#'+n.id);
      else if (location.hash === '#'+n.id)
        history.replaceState(null,'', location.pathname + location.search);
    });
  });
  setTimeout(function(){ booting = false; }, 250);
  if ('ResizeObserver' in window) new ResizeObserver(draw).observe(grid);
  window.addEventListener('resize', draw);

  if (location.hash){
    var t = document.getElementById(location.hash.slice(1));
    if (t && t.matches && t.matches('#research-map details')){
      for (var el = t; el; el = el.parentElement && el.parentElement.closest('details'))
        el.open = true;
      t.scrollIntoView({block:'center'});
    }
  }
  var map = document.getElementById('research-map');
  var viewBtns = Array.prototype.slice.call(map.querySelectorAll('.rmap-views button'));
  var relWrap = map.querySelector('.rgraph-wrap');
  var animateGraph = null, startConstellation = null, stopConstellation = null, curView = 'tree';
  function showView(v){
    var changed = (v !== curView);
    curView = v;
    grid.hidden = (v !== 'tree');
    relWrap.hidden = (v !== 'relations');
    viewBtns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.view === v)); });
    if (v === 'tree'){
      draw();
      if (stopConstellation) stopConstellation(true);
    }
    if (!changed){
      if (v === 'relations' && startConstellation) startConstellation();
      return;
    }
    if (reduce) return;
    var shown = (v === 'tree') ? grid : relWrap;
    shown.classList.remove('v-in');
    shown.getBoundingClientRect();
    shown.classList.add('v-in');
    if (v === 'relations' && animateGraph) animateGraph();
  }
  viewBtns.forEach(function(b){
    b.addEventListener('click', function(){ showView(b.dataset.view); });
  });

  var rg = map.querySelector('svg.rgraph');
  if (rg){
    var rEdges = Array.prototype.slice.call(rg.querySelectorAll('.rg-edge'));
    var rNodes = Array.prototype.slice.call(rg.querySelectorAll('.rg-node'));
    var rSignals = Array.prototype.slice.call(rg.querySelectorAll('.rg-signal'));
    var rListNodes = Array.prototype.slice.call(map.querySelectorAll('.rgraph-list button'));
    var nodeById = {};
    rNodes.forEach(function(n){ nodeById[n.getAttribute('data-id')] = n; });
    function endpoints(el){
      return [nodeById[el.getAttribute('data-from')], nodeById[el.getAttribute('data-to')]];
    }
    function basePoint(n){
      return {x:parseFloat(n.getAttribute('data-x')), y:parseFloat(n.getAttribute('data-y')),
        r:parseFloat(n.getAttribute('data-radius')) || 0};
    }
    function trimLine(a,b){
      var dx = b.x-a.x, dy = b.y-a.y, len = Math.sqrt(dx*dx+dy*dy) || 1;
      var ux = dx/len, uy = dy/len;
      return {
        a:{x:a.x+ux*(a.r+7), y:a.y+uy*(a.r+7)},
        b:{x:b.x-ux*(b.r+7), y:b.y-uy*(b.r+7)}
      };
    }
    function curveGeometry(a,b,bend){
      var segment = trimLine(a,b);
      var dx = segment.b.x-segment.a.x, dy = segment.b.y-segment.a.y;
      var len = Math.sqrt(dx*dx+dy*dy) || 1;
      return {
        a:segment.a, b:segment.b,
        c:{x:(segment.a.x+segment.b.x)/2-dy/len*bend,
          y:(segment.a.y+segment.b.y)/2+dx/len*bend}
      };
    }
    function curvePoint(g,p){
      var q = 1-p;
      return {x:q*q*g.a.x+2*q*p*g.c.x+p*p*g.b.x,
        y:q*q*g.a.y+2*q*p*g.c.y+p*p*g.b.y};
    }
    function updateLinks(points, elapsed){
      rEdges.forEach(function(e){
        var pair = endpoints(e), a = points[pair[0].getAttribute('data-id')], b = points[pair[1].getAttribute('data-id')];
        var g = curveGeometry(a,b,parseFloat(e.getAttribute('data-bend')) || 0);
        e.setAttribute('d','M'+g.a.x+' '+g.a.y+'Q'+g.c.x+' '+g.c.y+' '+g.b.x+' '+g.b.y);
      });
      rSignals.forEach(function(s){
        var pair = endpoints(s), a = points[pair[0].getAttribute('data-id')], b = points[pair[1].getAttribute('data-id')];
        var g = curveGeometry(a,b,parseFloat(s.getAttribute('data-bend')) || 0);
        var phase = parseFloat(s.getAttribute('data-phase')) || 0;
        var p = (elapsed / (5200 + phase*110) + phase*.137) % 1;
        var point = curvePoint(g,p);
        s.setAttribute('cx', point.x);
        s.setAttribute('cy', point.y);
        s.style.opacity = String(Math.sin(Math.PI*p)*.9);
      });
    }
    function resetConstellation(){
      var points = {};
      rNodes.forEach(function(n){
        var p = basePoint(n);
        n.setAttribute('transform','translate('+p.x+' '+p.y+')');
        points[n.getAttribute('data-id')] = p;
      });
      updateLinks(points, 0);
      rSignals.forEach(function(s){ s.style.opacity = '0'; });
    }
    var motionFrame = 0, motionEpoch = 0, constellationVisible = true;
    function canMove(){
      return !reduce && curView === 'relations' && constellationVisible &&
        document.visibilityState !== 'hidden' && window.innerWidth > 620;
    }
    function moveConstellation(now){
      if (!canMove()){ motionFrame = 0; return; }
      var elapsed = now-motionEpoch, points = {};
      rNodes.forEach(function(n,i){
        var base = basePoint(n), phase = i*.83, scale = n.classList.contains('core') ? .55 : 1;
        var dx = (Math.sin(elapsed/2600+phase)-Math.sin(phase))*2.2*scale;
        var dy = (Math.cos(elapsed/3100+phase)-Math.cos(phase))*1.8*scale;
        var p = {x:base.x+dx, y:base.y+dy, r:base.r};
        n.setAttribute('transform','translate('+p.x.toFixed(2)+' '+p.y.toFixed(2)+')');
        points[n.getAttribute('data-id')] = p;
      });
      updateLinks(points, elapsed);
      motionFrame = requestAnimationFrame(moveConstellation);
    }
    startConstellation = function(){
      if (!canMove() || motionFrame) return;
      motionEpoch = performance.now();
      rg.setAttribute('data-motion','true');
      motionFrame = requestAnimationFrame(moveConstellation);
    };
    stopConstellation = function(reset){
      if (motionFrame) cancelAnimationFrame(motionFrame);
      motionFrame = 0;
      rg.removeAttribute('data-motion');
      if (reset) resetConstellation();
    };
    var parents = {}, children = {};
    rNodes.forEach(function(n){
      var id = n.getAttribute('data-id');
      parents[id] = []; children[id] = [];
    });
    rEdges.forEach(function(e){
      var from = e.getAttribute('data-from'), to = e.getAttribute('data-to');
      parents[to].push(from);
      children[from].push(to);
    });
    function addAncestors(id,keep){
      if (keep[id]) return;
      keep[id] = 1;
      parents[id].forEach(function(parent){ addAncestors(parent,keep); });
    }
    function setFocus(id){
      if (!id){
        rg.removeAttribute('data-focus');
        rEdges.concat(rNodes).forEach(function(el){ el.classList.remove('hl'); });
        return;
      }
      rg.setAttribute('data-focus','');
      var keep = {}, seeds = [id].concat(parents[id],children[id]);
      seeds.forEach(function(seed){ addAncestors(seed,keep); });
      rEdges.forEach(function(e){
        var on = !!keep[e.getAttribute('data-from')] && !!keep[e.getAttribute('data-to')];
        e.classList.toggle('hl', on);
      });
      rNodes.forEach(function(n){ n.classList.toggle('hl', !!keep[n.getAttribute('data-id')]); });
    }
    function openTargets(value){
      var ids = (value || '').split(' ').filter(Boolean);
      if (!ids.length) return;
      showView('tree');
      ids.forEach(function(i){
        var d = document.getElementById(i);
        if (d) for (var el = d; el; el = el.parentElement && el.parentElement.closest('details')) el.open = true;
      });
      var first = document.getElementById(ids[0]);
      if (first) first.scrollIntoView({block:'center'});
    }
    rNodes.forEach(function(n){
      var id = n.getAttribute('data-id');
      n.addEventListener('mouseenter', function(){
        if (stopConstellation) stopConstellation(true);
        setFocus(id);
      });
      n.addEventListener('mouseleave', function(){
        setFocus(null);
        if (startConstellation) startConstellation();
      });
      n.addEventListener('focus', function(){ setFocus(id); });
      n.addEventListener('blur', function(){ setFocus(null); });
      function act(){ openTargets(n.getAttribute('data-open')); }
      n.addEventListener('click', act);
      n.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); act(); }
      });
    });
    rListNodes.forEach(function(n){
      n.addEventListener('click', function(){ openTargets(n.getAttribute('data-open')); });
    });

    /* Entering the relations view: the constellation settles, then shifts into slow live motion. */
    var gRun = 0;
    animateGraph = function(){
      var run = ++gRun;
      rNodes.forEach(function(n){ n.classList.remove('rg-in'); });
      rEdges.forEach(function(e){
        e.style.transition = ''; e.style.strokeDasharray = ''; e.style.strokeDashoffset = '';
      });
      rg.getBoundingClientRect();
      rNodes.forEach(function(n,i){
        n.style.setProperty('--d', (i*30) + 'ms');
        n.classList.add('rg-in');
      });
      rEdges.forEach(function(e,i){
        var L = e.getTotalLength() || 1;
        e.style.strokeDasharray = L + ' ' + L;
        e.style.strokeDashoffset = L;
        e.getBoundingClientRect();
        e.style.transition = 'stroke-dashoffset .55s ease-out ' + (i*25) + 'ms';
        e.style.strokeDashoffset = '0';
      });
      setTimeout(function(){
        if (run !== gRun) return;
        rNodes.forEach(function(n){ n.classList.remove('rg-in'); n.style.removeProperty('--d'); });
        rEdges.forEach(function(e){
          e.style.transition = ''; e.style.strokeDasharray = ''; e.style.strokeDashoffset = '';
        });
        if (startConstellation) startConstellation();
      }, 600 + rEdges.length*25);
    };
    if ('IntersectionObserver' in window){
      var rgIo = new IntersectionObserver(function(en){
        constellationVisible = en[0].isIntersecting;
        if (constellationVisible){
          if (startConstellation) startConstellation();
        } else if (stopConstellation) stopConstellation(true);
      }, {threshold:.08});
      rgIo.observe(map);
    }
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden'){
        if (stopConstellation) stopConstellation(true);
      } else if (startConstellation) startConstellation();
    });
    window.addEventListener('resize', function(){
      if (canMove()){
        if (startConstellation) startConstellation();
      } else if (stopConstellation) stopConstellation(true);
    });
    rg.addEventListener('focusin', function(){
      if (stopConstellation) stopConstellation(true);
    });
    rg.addEventListener('focusout', function(){
      setTimeout(function(){
        if (!rg.contains(document.activeElement) && startConstellation) startConstellation();
      },0);
    });
    resetConstellation();
  }

  if ('IntersectionObserver' in window && !reduce){
    var io = new IntersectionObserver(function(en){
      if (en[0].isIntersecting){ io.disconnect(); reveal(); }
    }, {threshold:0.12});
    io.observe(grid);
  } else {
    reveal();
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  draw();
})();
</script>
